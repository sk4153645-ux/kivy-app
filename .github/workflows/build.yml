name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Fix Android SDK tools path for Buildozer
        run: |
          # Symlink modern cmdline-tools to legacy tools path expected by older buildozer logic
          if [ -d "$ANDROID_HOME/cmdline-tools/latest" ] && [ ! -d "$ANDROID_HOME/tools" ]; then
            sudo ln -s $ANDROID_HOME/cmdline-tools/latest $ANDROID_HOME/tools
          fi

      - name: Install Pinned Buildozer & Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3.0"
          python -m pip install --upgrade git+https://github.com/kivy/buildozer.git
          python -m pip install --upgrade git+https://github.com/kivy/python-for-android.git

      - name: Build APK with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nilgiri-Dairy-APK
          path: bin/*.apk
