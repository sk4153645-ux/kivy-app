name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo docker system prune -af || true

      - name: Install System Dependencies
        run: |
          sudo apt-get update -o APT::Update::Post-Invoke-Success=""
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev python3-dev ccache build-essential

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 Cython==0.29.36 virtualenv

      - name: Auto-Accept Android SDK Licenses & Setup Build Tools
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33" || true
          fi

      - name: Point buildozer.spec at the pre-installed NDK
        run: |
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/*/ 2>/dev/null | sort -V | tail -n1)
          NDK_DIR="${NDK_DIR%/}"
          echo "Detected installed NDK at: $NDK_DIR"
          if [ -z "$NDK_DIR" ]; then
            echo "WARNING: no NDK found under \$ANDROID_HOME/ndk - build may try to download one."
          elif grep -q "^android.ndk_path" buildozer.spec; then
            sed -i "s|^android.ndk_path = .*|android.ndk_path = $NDK_DIR|" buildozer.spec
          else
            sed -i "/^\[app\]/a android.ndk_path = $NDK_DIR" buildozer.spec
          fi
          grep "android.ndk_path" buildozer.spec || echo "(no android.ndk_path line found - continuing anyway)"

      - name: Inject API Key
        run: |
          echo "GEMINI_API_KEY = \"${{ secrets.GEMINI_API_KEY }}\"" > secrets_config.py

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NilgiriDairy-APK
          path: bin/*.apk
