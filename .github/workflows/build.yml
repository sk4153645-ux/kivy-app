name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Pinned Build Tools & Virtualenv Seed
        run: |
          python -m pip install --upgrade "pip==24.0" "setuptools<70.0.0" wheel
          python -m pip install "buildozer==1.5.0" "cython==0.29.36" "virtualenv==20.25.3"
          # Ensure target virtualenv seeds with compatible pip
          python -m virtualenv --upgrade-embed-wheels

      - name: Build APK with Buildozer
        run: |
          # Clean broken cached build env
          rm -rf .buildozer/android/platform/build-arm64-v8a/build/venv
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nilgiri-Dairy-APK
          path: bin/*.apk
